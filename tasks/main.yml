---
# =============================================================================
# setup_containerd — point d'entrée
# Le playbook appelant passe les nœuds en serial: 1 : un seul nœud drainé à la
# fois. En cas d'échec après le drain, le nœud RESTE cordonné : c'est voulu,
# on ne renvoie pas de pods sur un runtime dans un état inconnu.
# =============================================================================

- name: Préflight
  ansible.builtin.import_tasks: preflight.yml

- name: Dépôt Docker et résolution de la version cible
  ansible.builtin.import_tasks: repo.yml

- name: Installation (nœud neuf)
  ansible.builtin.include_tasks: install.yml
  when: containerd_installed_version | length == 0

- name: Upgrade (nœud en retard)
  ansible.builtin.include_tasks: upgrade.yml
  when:
    - containerd_installed_version | length > 0
    - containerd_installed_base != containerd_target_base

- name: Config par défaut du paquet remplacée si besoin
  ansible.builtin.import_tasks: config.yml

- name: Gel du paquet containerd.io
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: "{{ 'hold' if containerd_hold | bool else 'install' }}"

- name: Crictl
  ansible.builtin.import_tasks: crictl.yml

- name: Contrôles
  ansible.builtin.import_tasks: verify.yml

- name: Uncordon (le nœud a été drainé par ce run)
  ansible.builtin.command: "{{ containerd_kubectl }} uncordon {{ containerd_node_name }}"
  delegate_to: "{{ containerd_first_cp }}"
  changed_when: true
  when: containerd_drained | default(false) | bool
